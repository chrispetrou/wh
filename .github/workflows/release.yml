name: release

on:
  push:
    tags: ["v*"]

# every action is pinned to a full commit sha: this workflow can write releases
# and builds the binaries people install, so a moved tag must not be able to
# change what it runs. the version it was pinned from stays in the comment.
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable # the ref name no longer carries it once pinned
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test
      - run: cargo build --release --target ${{ matrix.target }}
      - name: size gate (binary must stay under 3.2MiB)
        run: |
          f=target/${{ matrix.target }}/release/wh
          size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
          echo "binary: $size bytes"
          test "$size" -lt 3355443
      - name: package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf wh-${{ github.ref_name }}-${{ matrix.target }}.tar.gz wh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wh-${{ matrix.target }}
          path: cli/target/${{ matrix.target }}/release/wh-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: dist
      - name: checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt
      - name: draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
