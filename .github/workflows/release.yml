name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test
      - run: cargo build --release --target ${{ matrix.target }}
      - name: size gate (binary must stay under 3.2MiB)
        run: |
          f=target/${{ matrix.target }}/release/wh
          size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
          echo "binary: $size bytes"
          test "$size" -lt 3355443
      - name: package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf wh-${{ github.ref_name }}-${{ matrix.target }}.tar.gz wh
      - uses: actions/upload-artifact@v4
        with:
          name: wh-${{ matrix.target }}
          path: cli/target/${{ matrix.target }}/release/wh-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt
      - name: draft release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
