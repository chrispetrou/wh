<text xml:space="preserve" class="rv o r18_424x20_457" x="16" y="74">#   eval "$(wd init zsh)"</text>
<text class="rv  r20_076x22_109" x="16" y="96">wd() {</text>
<text xml:space="preserve" class="rv  r21_728x23_761" x="16" y="118">  if [ "$1" = "switch" ]; then</text>
<text xml:space="preserve" class="rv  r23_38x25_413" x="16" y="140">    local _wd_dir</text>
<text xml:space="preserve" class="rv  r25_032x27_065" x="16" y="162">    _wd_dir="$(command wd "$@")" &amp;&amp; cd "$_wd_dir"</text>
<text xml:space="preserve" class="rv  r26_684x28_717" x="16" y="184">  else</text>
<text xml:space="preserve" class="rv  r28_335x30_368" x="16" y="206">    command wd "$@"</text>
